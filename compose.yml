---
services:
  web:
    image: salon-web:latest 
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://salon_user:salon_password@db:5432/salon_db
    depends_on:
      - db
    deploy:
      replicas: 2
    networks:
      - salon-network

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=salon_db
      - POSTGRES_USER=salon_user
      - POSTGRES_PASSWORD=salon_password
    ports:
      - "5432:5432"
    deploy:
      replicas: 1
    networks:
      - salon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon_user -d salon_db"]
      interval: 30s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      - db
    deploy:
      replicas: 1
    networks:
      - salon-network

networks:
  salon-network:
    driver: overlay
