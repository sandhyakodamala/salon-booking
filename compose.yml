version: '3.8'

services:
  # Service 1: Web Application (Your custom image)
  web:
    image: sandhyakodamala/salonbooking:app_img
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://salon_user:salon_password@db:5432/salon_db
    depends_on:
      - db
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    networks:
      - salon-network

  # Service 2: Database (Your custom image)
  db:
    image: sandhyakodamala/salonbooking:db_img
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      - POSTGRES_DB=salon_db
      - POSTGRES_USER=salon_user
      - POSTGRES_PASSWORD=salon_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - salon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon_user -d salon_db"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Service 3: Adminer (Your custom image)
  adminer:
    image: sandhyakodamala/salonbooking:adminer_img
    build:
      context: ./adminer
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      - db
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - salon-network

volumes:
  postgres_data:

networks:
  salon-network:
    driver: overlay
