version: '3.8'

services:
  web:
    image: sandhyakodamala/salonbooking:app_img
    ports:
      - "4999:5000"
    environment:
      - DATABASE_URL=postgresql://salon_user:salon_password@db:5432/salon_db
    depends_on:
      - db
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - salon-network

  db:
    image: sandhyakodamala/salonbooking:db_img
    environment:
      - POSTGRES_DB=salon_db
      - POSTGRES_USER=salon_user
      - POSTGRES_PASSWORD=salon_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - salon-network

  adminer:
    image: sandhyakodamala/salonbooking:adminer_img
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      - db
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - salon-network

volumes:
  postgres_data:

networks:
  salon-network:
    driver: overlay
    attachable: true   # ← Important for service discovery
